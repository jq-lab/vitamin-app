<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1420" viewBox="0 0 1380 1420">
  <defs>
    <style>
      .bg { fill: #F7F4EF; }
      .phone { fill: #FFFDF9; stroke: #222222; stroke-width: 3; }
      .panel { fill: #F3EFE8; stroke: #5A5148; stroke-width: 1.5; }
      .soft { fill: #E8F0EA; stroke: #486452; stroke-width: 1.5; }
      .accent { fill: #D9E6F5; stroke: #405A77; stroke-width: 1.5; }
      .warn { fill: #F5E7D9; stroke: #7A5B3F; stroke-width: 1.5; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #222222; font-size: 20px; }
      .small { font-size: 16px; fill: #4F4A45; }
      .tiny { font-size: 13px; fill: #6D655E; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 30px; font-weight: 800; }
      .button { fill: #222222; }
      .buttonText { font-size: 16px; fill: #FFFFFF; font-weight: 600; }
      .ghost { fill: #FFFFFF; stroke: #81776D; stroke-width: 1.5; }
      .ghostText { font-size: 16px; fill: #2F2A26; }
      .line { stroke: #B8AEA3; stroke-width: 1.5; }
      .dot { fill: #222222; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1380" height="1420"/>
  <text class="section" x="40" y="56">Vitora P0 · 旧重设计资产</text>
  <text class="text small" x="40" y="88">状态：已被正式 pivot 规格替代；仅作历史证据，不作为当前实现目标。</text>

  <!-- Onboarding -->
  <g transform="translate(40,130)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-001 新手引导</text>
    <text class="small" x="28" y="84">三步以内，账号不做门槛</text>
    <rect class="panel" x="28" y="112" width="334" height="110" rx="18"/>
    <text class="text" x="48" y="148">1. 先认识你</text>
    <text class="tiny" x="48" y="178">偏好称呼 · 生日上下文</text>
    <rect class="soft" x="28" y="238" width="334" height="128" rx="18"/>
    <text class="text" x="48" y="274">2. 给 Vitora 一点上下文</text>
    <text class="tiny" x="48" y="304">周期信息可跳过 · 关注方向 2-3 个</text>
    <text class="tiny" x="48" y="330">HealthKit 是可选增强</text>
    <rect class="accent" x="28" y="382" width="334" height="100" rx="18"/>
    <text class="text" x="48" y="418">3. 准备完成</text>
    <text class="tiny" x="48" y="448">进入 Today，开始第一次状态理解</text>
    <rect class="button" x="92" y="504" width="206" height="38" rx="19"/>
    <text class="buttonText" x="149" y="529">进入 Today</text>
  </g>

  <!-- Energy ritual -->
  <g transform="translate(495,130)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-003 能量仪式</text>
    <text class="small" x="28" y="84">每日首次，可跳过</text>
    <circle class="accent" cx="195" cy="188" r="78"/>
    <circle class="soft" cx="195" cy="188" r="42"/>
    <text class="text" x="92" y="304">正在整理今天可用的信息</text>
    <rect class="ghost" x="270" y="330" width="78" height="34" rx="17"/>
    <text class="ghostText" x="294" y="352">跳过</text>
    <line class="line" x1="60" y1="398" x2="330" y2="398"/>
    <text class="text" x="112" y="440">状态揭示 + 一句话依据</text>
    <text class="tiny" x="110" y="468">CL-DEFAULT 在解释区出现</text>
    <rect class="button" x="54" y="504" width="130" height="38" rx="19"/>
    <text class="buttonText" x="86" y="529">查看分析</text>
    <rect class="ghost" x="206" y="504" width="130" height="38" rx="19"/>
    <text class="ghostText" x="242" y="529">回 Today</text>
  </g>

  <!-- A/B and Review -->
  <g transform="translate(950,130)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-004 + WF-008</text>
    <text class="small" x="28" y="84">A/B 承诺连接晚间复盘</text>
    <rect class="panel" x="28" y="116" width="334" height="170" rx="22"/>
    <text class="text" x="52" y="154">Today 分析 sheet</text>
    <text class="tiny" x="52" y="184">状态摘要 · 支撑因素 1-3 个</text>
    <rect class="ghost" x="52" y="214" width="130" height="40" rx="20"/>
    <text class="ghostText" x="88" y="240">选项 A</text>
    <rect class="ghost" x="208" y="214" width="130" height="40" rx="20"/>
    <text class="ghostText" x="244" y="240">选项 B</text>
    <rect class="soft" x="28" y="316" width="334" height="150" rx="22"/>
    <text class="text" x="52" y="354">晚间复盘</text>
    <text class="tiny" x="52" y="384">对比介入前后感受</text>
    <text class="tiny" x="52" y="410">有帮助 · 一般 · 没试 · 不适合</text>
    <text class="tiny" x="52" y="436">反馈进入 Vitora 学习</text>
    <rect class="button" x="92" y="504" width="206" height="38" rx="19"/>
    <text class="buttonText" x="148" y="529">完成复盘</text>
  </g>

  <!-- Drawer and support -->
  <g transform="translate(40,760)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-011 轻抽屉</text>
    <text class="small" x="28" y="84">只显示 P0 支撑项</text>
    <rect class="panel" x="28" y="116" width="334" height="344" rx="24"/>
    <text class="text" x="52" y="154">Vitora</text>
    <circle class="dot" cx="60" cy="198" r="5"/><text class="small" x="78" y="204">个人资料</text>
    <circle class="dot" cx="60" cy="238" r="5"/><text class="small" x="78" y="244">HealthKit 与数据来源</text>
    <circle class="dot" cx="60" cy="278" r="5"/><text class="small" x="78" y="284">营养补给</text>
    <circle class="dot" cx="60" cy="318" r="5"/><text class="small" x="78" y="324">提醒偏好</text>
    <circle class="dot" cx="60" cy="358" r="5"/><text class="small" x="78" y="364">数据导出</text>
    <circle class="dot" cx="60" cy="398" r="5"/><text class="small" x="78" y="404">隐私法律与账号移除</text>
    <text class="tiny" x="52" y="438">不展示延期入口和占位页</text>
    <rect class="button" x="92" y="504" width="206" height="38" rx="19"/>
    <text class="buttonText" x="156" y="529">关闭</text>
  </g>

  <!-- Nutrition -->
  <g transform="translate(495,760)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-012 营养补给</text>
    <text class="small" x="28" y="84">管理页 + Vitora 快捷新增</text>
    <rect class="warn" x="28" y="116" width="334" height="72" rx="18"/>
    <text class="tiny" x="48" y="148">CL-NUTRITION</text>
    <text class="tiny" x="48" y="170">只记录已经在用的内容</text>
    <rect class="panel" x="28" y="212" width="334" height="206" rx="22"/>
    <text class="text" x="52" y="250">已记录内容</text>
    <line class="line" x1="52" y1="282" x2="338" y2="282"/>
    <text class="tiny" x="52" y="314">名称 · 频率 / 备注 · 编辑</text>
    <line class="line" x1="52" y1="342" x2="338" y2="342"/>
    <text class="tiny" x="52" y="374">空状态：可新增，也可返回</text>
    <rect class="button" x="74" y="450" width="242" height="42" rx="21"/>
    <text class="buttonText" x="126" y="477">添加已在使用的内容</text>
    <text class="tiny" x="88" y="526">Vitora 记录 sheet 可快捷新增</text>
  </g>

  <!-- Low data -->
  <g transform="translate(950,760)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="36"/>
    <text class="title" x="28" y="54">WF-013 低数据状态</text>
    <text class="small" x="28" y="84">不是失败态，必须可继续</text>
    <rect class="soft" x="28" y="122" width="334" height="106" rx="20"/>
    <text class="text" x="52" y="160">当前可用信息较少</text>
    <text class="tiny" x="52" y="190">继续手动记录，或稍后连接 HealthKit</text>
    <rect class="panel" x="28" y="258" width="334" height="180" rx="22"/>
    <text class="text" x="52" y="296">可继续动作</text>
    <circle class="dot" cx="60" cy="332" r="5"/><text class="small" x="78" y="338">告诉 Vitora 一件事</text>
    <circle class="dot" cx="60" cy="372" r="5"/><text class="small" x="78" y="378">查看数据来源</text>
    <circle class="dot" cx="60" cy="412" r="5"/><text class="small" x="78" y="418">稍后再看</text>
    <rect class="button" x="92" y="504" width="206" height="38" rx="19"/>
    <text class="buttonText" x="142" y="529">继续使用</text>
  </g>
</svg>
